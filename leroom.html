<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeRoom</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg-deep:#17140f; --paper:#2e2820; --paper-light:#3a3226; --paper-edge:#211d16;
    --border:#4a4030; --text:#ece6d8; --text-2:#b3a68e; --text-3:#857b66;
    --gold:#c9a876; --gold-dim:#a8946f;
  }
  * { box-sizing: border-box; }
  html, body{ height:100%; margin:0; }
  body{
    font-family:"Microsoft JhengHei",Helvetica,Arial,sans-serif;
    background:var(--bg-deep); color:var(--text);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }

  /* ===== 登入畫面 ===== */
  #loginScreen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  }
  #loginScreen h1{ font-weight:500; font-size:20px; color:var(--gold); }
  .google-btn{
    background:var(--paper-light); border:0.5px solid var(--border); color:var(--text);
    padding:10px 20px; border-radius:8px; font-size:14px; cursor:pointer;
  }

  /* ===== LeRoom 主畫面 ===== */
  #mainApp{ display:none; flex:1; flex-direction:column; min-height:0; }

  .bridge-bar{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 16px; flex-shrink:0; font-size:12px; color:var(--text-3);
  }
  .bridge-side{
    display:flex; align-items:center; gap:4px; cursor:pointer;
    padding:6px 10px; border-radius:6px; border:0.5px solid var(--border);
    background:var(--paper-edge);
  }
  .bridge-side:hover{ color:var(--gold); }

  .room-body{ flex:1; display:flex; flex-direction:column; min-height:0; padding:0 16px; }

  .card-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:10px 0; }

  .paper-card{
    position:relative; max-width:88%; align-self:flex-start;
    padding:12px 16px; box-sizing:border-box;
    background:linear-gradient(160deg, var(--paper-light) 0%, var(--paper) 55%, var(--paper-edge) 100%);
    border-radius:4px 14px 14px 14px;
    box-shadow:0 1px 1px rgba(0,0,0,0.3), 0 4px 8px -2px rgba(0,0,0,0.45);
    border:0.5px solid rgba(0,0,0,0.3);
  }
  .paper-card .original{ font-size:14px; color:var(--text); }
  .paper-card .translated{ font-size:13px; color:var(--gold-dim); margin-top:6px; border-top:0.5px dashed rgba(201,168,118,0.25); padding-top:6px; }
  .paper-card .explain{ font-size:12px; color:var(--text-2); margin-top:4px; }
  .paper-card .status{ font-size:10px; color:var(--text-3); margin-top:4px; }

  .input-zone{
    flex-shrink:0; padding:12px 0 16px; display:flex; gap:8px;
  }
  .input-zone input{
    flex:1; background:var(--paper-edge); border:0.5px solid var(--border); border-radius:8px;
    padding:10px 12px; color:var(--text); font-size:14px; outline:none;
  }
  .input-zone select{
    background:var(--paper-edge); border:0.5px solid var(--border); border-radius:8px;
    color:var(--text); font-size:12px; padding:0 8px;
  }
  .input-zone button{
    background:var(--gold); border:none; border-radius:8px; color:#1a1a1a; font-weight:600;
    padding:0 18px; cursor:pointer;
  }
  .input-zone button:disabled{ opacity:0.5; }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>LeRoom</h1>
  <div style="color:var(--text-3); font-size:12px;">請先登入才能使用</div>
  <button class="google-btn" onclick="loginWithGoogle()">使用 Google 帳號登入</button>
</div>

<div id="mainApp">
  <div class="bridge-bar">
    <div class="bridge-side" onclick="goToLeNook()">← LeNook</div>
    <div id="userLabel" style="color:var(--text-2);"></div>
    <div class="bridge-side" onclick="goToLeDoor()">LeDoor →</div>
  </div>

  <div class="room-body">
    <div class="card-list" id="cardList"></div>
    <div class="input-zone">
      <input id="msgInput" type="text" placeholder="貼上任何語言的一句話...">
      <select id="langSelect">
        <option value="繁體中文">繁體中文</option>
        <option value="English">English</option>
        <option value="日本語">日本語</option>
        <option value="Русский">Русский</option>
        <option value="Español">Español</option>
      </select>
      <button id="sendBtn" onclick="handleSend()">送出</button>
    </div>
  </div>
</div>

<script>
  // ⚠️ LeDoor專案自己的Firebase設定值（跟聊天橋、秒懂完全獨立）
  const firebaseConfig = {
    apiKey: "AIzaSyAjv4A5ftD2Kf7HqvUFRvNJvzs1AokP4NY",
    authDomain: "ledoor.firebaseapp.com",
    projectId: "ledoor",
    storageBucket: "ledoor.firebasestorage.app",
    messagingSenderId: "1079192070719",
    appId: "1:1079192070719:web:666c27db36e676f98ee68a"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const WORKER_URL = "https://ledoor-worker.le-core-bridge.workers.dev";

  let currentUser = null;

  function loginWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch((err) => {
      alert("登入失敗：" + err.message);
    });
  }

  // 之後LeNook/LeDoor正式網址確定了，把下面兩個網址換掉就好
  function goToLeNook() {
    window.location.href = "https://example.com/lenook"; // TODO: 換成LeNook正式網址
  }
  function goToLeDoor() {
    window.location.href = "https://lecorebridge.github.io/ledoor-app/"; // LeDoor走廊首頁
  }

  auth.onAuthStateChanged((user) => {
    if (user) {
      currentUser = user;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'flex';
      document.getElementById('userLabel').textContent = user.displayName || user.email;
      loadHistory();
    } else {
      currentUser = null;
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('mainApp').style.display = 'none';
    }
  });

  // LeRoom是個人空間，訊息存在「使用者自己的uid底下」，跟別人完全不共用
  function messagesCollection() {
    return db.collection('users').doc(currentUser.uid).collection('leroomMessages');
  }

  function renderCard(data) {
    const list = document.getElementById('cardList');
    const card = document.createElement('div');
    card.className = 'paper-card';
    card.innerHTML = `
      <div class="original">${escapeHtml(data.text)}</div>
      <div class="status">${data.status === 'loading' ? '翻譯中...' : ''}</div>
    `;
    list.appendChild(card);
    list.scrollTop = list.scrollHeight;
    return card;
  }

  function fillCard(card, result) {
    const statusEl = card.querySelector('.status');
    if (statusEl) statusEl.remove();
    if (result.error) {
      card.innerHTML += `<div class="explain" style="color:#c98a76;">${escapeHtml(result.error)}</div>`;
      return;
    }
    card.innerHTML += `
      <div class="translated">${escapeHtml(result.translated || '')}</div>
      <div class="explain">${escapeHtml(result.explain || '')}</div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // 從Worker回傳的內容裡，把固定欄位格式（【翻譯...】【語意解釋...】）解析出來
  function parseWorkerContent(content) {
    const translatedMatch = content.match(/【翻譯[^】]*】([\s\S]*?)(?=【|$)/);
    const explainMatch = content.match(/【語意解釋[^】]*】([\s\S]*?)(?=【|$)/);
    return {
      translated: translatedMatch ? translatedMatch[1].trim() : '',
      explain: explainMatch ? explainMatch[1].trim() : ''
    };
  }

  async function handleSend() {
    const input = document.getElementById('msgInput');
    const lang = document.getElementById('langSelect').value;
    const text = input.value.trim();
    if (!text || !currentUser) return;

    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;
    input.value = '';

    const card = renderCard({ text, status: 'loading' });

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'full', text, viewerLang: lang, testMode: true })
      });
      const data = await res.json();

      if (data.error) {
        fillCard(card, { error: data.error.message });
      } else {
        const content = data.choices && data.choices[0] && data.choices[0].message
          ? data.choices[0].message.content : '';
        const parsed = parseWorkerContent(content);
        fillCard(card, parsed);

        // 存進LeRoom的個人歷史紀錄
        messagesCollection().add({
          text, lang,
          translated: parsed.translated,
          explain: parsed.explain,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).catch((e) => console.error('儲存失敗', e));
      }
    } catch (e) {
      fillCard(card, { error: '連線失敗，請確認網路後再試一次。' });
    }
    sendBtn.disabled = false;
  }

  document.getElementById('msgInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSend();
  });

  function loadHistory() {
    messagesCollection().orderBy('createdAt', 'asc').limit(50).get().then((snapshot) => {
      snapshot.forEach((doc) => {
        const d = doc.data();
        const card = renderCard({ text: d.text });
        fillCard(card, { translated: d.translated, explain: d.explain });
      });
    }).catch((e) => console.error('讀取歷史紀錄失敗', e));
  }
</script>

</body>
</html>
